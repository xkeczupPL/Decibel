<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="style.css">
    <title>Decibel</title>
</head>
<body>
    <div class="main">
        <input class="search-input" type="text" enterkeyhint="search" placeholder="Wpisz nazwę utworu">
        <div class="track-list"></div>
    </div>

    <div class="player">
        <span id="now-playing">Brak utworu</span>
        <input type="range" id="progress-slider" class="progress-bar" min="0" max="100" value="0" disabled>
        <span id="time-display">0:00 / 0:00</span>
        <div class="controls">
            <button class="btn" id="lyrics-btn">Tekst</button>
            <button class="btn play-btn" id="play-btn">Odtwórz</button>
            <button class="btn" id="next-btn">Następna</button>
        </div>
        <input type="range" id="volume-slider" min="0" max="100" value="80">
    </div>

    <div class="sidebar">
        <button class="btn active" id="btn-home">Strona główna</button>
        <button class="btn" id="btn-search">Szukaj</button>
        <button class="btn" id="btn-library">Biblioteka</button>
        <button class="btn" id="btn-offline">Offline</button>
    </div>

    <audio id="audio-player" preload="auto"></audio>
    <div id="toast" class="toast"></div>
    <div id="backdrop" class="backdrop"></div>
    <div id="playlist-modal" class="modal-box"></div>
    <div id="lyrics-modal" class="modal-box lyrics-modal"></div>

    <script>
        const DOMYSLNE_INSTANCJE = [
            "https://api.piped.private.coffee",
            "https://pipedapi.ducks.party",
            "https://pipedapi.kavin.rocks",
            "https://pipedapi.adminforge.de"
        ];

        const LISTA_INSTANCJI_URL = "https://raw.githubusercontent.com/jayxdcode/piped-instances/main/public/minimal.json";

        const INVIDIOUS_INSTANCJE = [
            "https://inv.nadeko.net",
            "https://yewtu.be",
            "https://invidious.nerdvpn.de",
            "https://invidious.f5.si"
        ];

        let aktualnyBlobUrl = null;
        let ostatnieNaglowki = {};
        let ostatniTypAudio = "audio/mp4";
        let probaPamieci = false;
        let PIPED_INSTANCES = DOMYSLNE_INSTANCJE.slice();
        let ostatniBlad = "";
        let bledy = [];

        const GATUNKI = ["Rock i Metal", "Rap i Hip-Hop", "Pop", "Muzyka Elektroniczna", "Chill / Lo-Fi"];

        const searchInput = document.querySelector('.search-input');
        const trackList = document.querySelector('.track-list');
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const nextBtn = document.getElementById('next-btn');
        const lyricsBtn = document.getElementById('lyrics-btn');
        const nowPlaying = document.getElementById('now-playing');
        const timeDisplay = document.getElementById('time-display');
        const progressSlider = document.getElementById('progress-slider');
        const volumeSlider = document.getElementById('volume-slider');
        const toast = document.getElementById('toast');
        const backdrop = document.getElementById('backdrop');
        const playlistModal = document.getElementById('playlist-modal');
        const lyricsModal = document.getElementById('lyrics-modal');
        const navButtons = document.querySelectorAll('.sidebar .btn');

        let aktualnaKolejka = [];
        let aktualnyIndeks = -1;
        let aktualnyUtwor = null;
        let trybLosowy = false;
        let playlisty = { "Ulubione": [] };
        let aktywnySerwer = 0;
        let tokenOdtwarzania = 0;
        let tokenWidoku = 0;
        let czasToast = null;

        function el(tag, klasa, tekst) {
            const e = document.createElement(tag);
            if (klasa) e.className = klasa;
            if (tekst !== undefined) e.textContent = tekst;
            return e;
        }

        function przycisk(tekst, klasa, akcja) {
            const b = el('button', 'btn' + (klasa ? ' ' + klasa : ''), tekst);
            b.addEventListener('click', akcja);
            return b;
        }

        function naglowek(tytul, przyciski) {
            const d = el('div', 'section-header');
            d.appendChild(el('h3', '', tytul));
            const akcje = el('div', 'actions');
            przyciski.forEach(p => akcje.appendChild(p));
            d.appendChild(akcje);
            return d;
        }

        function komunikat(tekst) {
            const item = el('div', 'track-item');
            item.appendChild(el('span', 'track-title', tekst));
            return item;
        }

        function pokazPowiadomienie(tekst) {
            toast.textContent = tekst;
            toast.style.display = 'block';
            clearTimeout(czasToast);
            czasToast = setTimeout(() => {
                toast.style.display = 'none';
            }, 1500);
        }

        function formatTime(sekundy) {
            if (isNaN(sekundy)) return "0:00";
            const min = Math.floor(sekundy / 60);
            const sek = Math.floor(sekundy % 60);
            return min + ":" + (sek < 10 ? "0" : "") + sek;
        }

        async function odswiezInstancje() {
            const kontroler = new AbortController();
            const limit = setTimeout(() => kontroler.abort(), 6000);
            try {
                const res = await fetch(LISTA_INSTANCJI_URL, { signal: kontroler.signal });
                if (!res.ok) return;
                const dane = await res.json();
                const wpisy = Array.isArray(dane) ? dane : (dane && dane.instances) || [];
                const zywe = wpisy
                    .filter(w => w && w.api_url && w.isLatest !== false)
                    .map(w => String(w.api_url).replace(/\/+$/, ""));
                const polaczone = [];
                zywe.concat(DOMYSLNE_INSTANCJE).forEach(u => {
                    if (!polaczone.includes(u)) polaczone.push(u);
                });
                PIPED_INSTANCES = polaczone.slice(0, 8);
                aktywnySerwer = 0;
            } catch (e) {
            } finally {
                clearTimeout(limit);
            }
        }

        async function zapytajPiped(sciezka, poprawne, limitMs = 8000) {
            for (let i = 0; i < PIPED_INSTANCES.length; i++) {
                const idx = (aktywnySerwer + i) % PIPED_INSTANCES.length;
                const serwer = PIPED_INSTANCES[idx];
                const kontroler = new AbortController();
                const limit = setTimeout(() => kontroler.abort(), limitMs);
                try {
                    const res = await fetch(serwer + sciezka, { signal: kontroler.signal });
                    const dane = await res.json().catch(() => null);
                    clearTimeout(limit);
                    if (res.ok && dane && (!poprawne || poprawne(dane))) {
                        aktywnySerwer = idx;
                        return dane;
                    }
                    const powod = dane && (dane.message || dane.error) ? String(dane.message || dane.error).slice(0, 80) : "zła odpowiedź";
                    zglosBlad(serwer.replace("https://", "") + ": " + res.status + " " + powod);
                } catch (e) {
                    clearTimeout(limit);
                    zglosBlad(serwer.replace("https://", "") + ": brak połączenia");
                }
                console.warn("Piped:", ostatniBlad);
            }
            return null;
        }

        async function pobierzStrumienInvidious(videoId) {
            for (const serwer of INVIDIOUS_INSTANCJE) {
                const kontroler = new AbortController();
                const limit = setTimeout(() => kontroler.abort(), 6000);
                try {
                    const res = await fetch(serwer + "/api/v1/videos/" + encodeURIComponent(videoId) + "?local=true", { signal: kontroler.signal });
                    const dane = await res.json().catch(() => null);
                    clearTimeout(limit);
                    const formaty = res.ok && dane && Array.isArray(dane.adaptiveFormats)
                        ? dane.adaptiveFormats.filter(f => f.url && f.type && f.type.startsWith("audio/"))
                        : [];
                    if (formaty.length) {
                        const waga = f => (f.type.includes("mp4") ? 1 : 0);
                        formaty.sort((a, b) => (waga(b) - waga(a)) || ((parseInt(b.bitrate) || 0) - (parseInt(a.bitrate) || 0)));
                        const url = formaty[0].url;
                        return url.startsWith("/") ? serwer + url : url;
                    }
                    zglosBlad(serwer.replace("https://", "") + ": " + res.status);
                } catch (e) {
                    clearTimeout(limit);
                    zglosBlad(serwer.replace("https://", "") + ": brak połączenia");
                }
                console.warn("Invidious:", ostatniBlad);
            }
            return null;
        }

        let innertubeObietnica = null;

        function pobierzInnertube() {
            if (!innertubeObietnica) {
                innertubeObietnica = import('./youtubei.bundle.js')
                    .then(m => m.Innertube.create({ retrieve_player: false, generate_session_locally: true }))
                    .catch(e => {
                        zglosBlad("youtubei: " + (e && e.message ? e.message : e));
                        innertubeObietnica = null;
                        return null;
                    });
            }
            return innertubeObietnica;
        }

        async function szukajYoutubei(query) {
            const yt = await pobierzInnertube();
            if (!yt) return null;
            try {
                const wynik = await yt.search(query);
                return (wynik.results || [])
                    .filter(r => r.type === 'Video' && r.id)
                    .map(r => ({
                        title: r.title && r.title.text ? r.title.text : String(r.title || ""),
                        url: r.id,
                        artist: r.author && r.author.name ? r.author.name : ""
                    }));
            } catch (e) {
                zglosBlad("youtubei szukaj: " + (e && e.message ? e.message : e));
                return null;
            }
        }

                const KLIENCI_YT = [
                        {
                            nazwa: "ANDROID_VR 1.65",
                            id: "28",
                            wersja: "1.65.10",
                            ua: "com.google.android.apps.youtube.vr.oculus/1.65.10 (Linux; U; Android 12L; eureka-user Build/SQ3A.220605.009.A1) gzip",
                            client: { clientName: "ANDROID_VR", clientVersion: "1.65.10", androidSdkVersion: 32, osName: "Android", osVersion: "12L", deviceMake: "Oculus", deviceModel: "Quest 3", hl: "en", gl: "US" }
                        },
                        {
                            nazwa: "TV_EMBEDDED",
                            id: "85",
                            wersja: "2.0",
                            ua: "Mozilla/5.0 (ChromiumStylePlatform) Cobalt/Version",
                            client: { clientName: "TVHTML5_SIMPLY_EMBEDDED_PLAYER", clientVersion: "2.0", clientScreen: "EMBED", hl: "en", gl: "US" },
                            thirdParty: { embedUrl: "https://www." + "you" + "tube" + ".com/" }
                        }
                    ];

                    async function zapytajKlientaYt(k, videoId) {
                        const endpoint = "https://www." + "you" + "tube" + ".com/youtubei/v1/player?prettyPrint=false";
                        const cialo = {
                            videoId: videoId,
                            params: "CgIIAQ==",
                            playbackContext: { contentPlaybackContext: { html5Preference: "HTML5_PREF_WANTS" } },
                            context: k.thirdParty ? { client: k.client, thirdParty: k.thirdParty } : { client: k.client }
                        };
                        const naglowki = {
                            "Content-Type": "application/json",
                            "User-Agent": k.ua,
                            "X-YouTube-Client-Name": k.id,
                            "X-YouTube-Client-Version": k.wersja
                        };
                        const cap = pobierzCapHttp();
                        if (cap) {
                            const odp = await cap.request({ url: endpoint, method: "POST", headers: naglowki, data: cialo });
                            const dane = typeof odp.data === "string" ? JSON.parse(odp.data) : odp.data;
                            return { dane: dane, status: odp.status };
                        }
                        const res = await fetch(endpoint, { method: "POST", headers: naglowki, body: JSON.stringify(cialo) });
                        return { dane: await res.json().catch(() => null), status: res.status };
                    }

        function pobierzCapHttp() {
            const cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
            return cap && cap.request ? cap : null;
        }

        async function zapytajKlientaYt(k, videoId) {
            const endpoint = "https://www.youtube.com/youtubei/v1/player?prettyPrint=false";
            const cialo = {
                videoId: videoId,
                params: "CgIIAQ==",
                playbackContext: { contentPlaybackContext: { html5Preference: "HTML5_PREF_WANTS" } },
                context: { client: k.client }
            };
            const naglowki = {
                "Content-Type": "application/json",
                "User-Agent": k.ua,
                "X-YouTube-Client-Name": k.id,
                "X-YouTube-Client-Version": k.wersja
            };
            const cap = pobierzCapHttp();
            if (cap) {
                const odp = await cap.request({ url: endpoint, method: "POST", headers: naglowki, data: cialo });
                const dane = typeof odp.data === "string" ? JSON.parse(odp.data) : odp.data;
                return { dane: dane, status: odp.status };
            }
            const res = await fetch(endpoint, { method: "POST", headers: naglowki, body: JSON.stringify(cialo) });
            return { dane: await res.json().catch(() => null), status: res.status };
        }

        async function pobierzStrumienYoutubei(videoId) {
            for (const k of KLIENCI_YT) {
                try {
                    const { dane, status } = await zapytajKlientaYt(k, videoId);
                    const formaty = (dane && dane.streamingData && Array.isArray(dane.streamingData.adaptiveFormats))
                        ? dane.streamingData.adaptiveFormats.filter(f => f.url && f.mimeType && f.mimeType.startsWith("audio/"))
                        : [];
                    if (formaty.length) {
                        const waga = f => (f.mimeType.includes("mp4") ? 1 : 0);
                        formaty.sort((x, y) => (waga(y) - waga(x)) || ((y.bitrate || 0) - (x.bitrate || 0)));
                        ostatnieNaglowki = { "User-Agent": k.ua };
                        ostatniTypAudio = formaty[0].mimeType.split(";")[0];
                        return formaty[0].url;
                    }
                    const stan = dane && dane.playabilityStatus
                        ? dane.playabilityStatus.status + " " + String(dane.playabilityStatus.reason || "").slice(0, 60)
                        : "HTTP " + status;
                    zglosBlad(k.nazwa + ": " + stan);
                } catch (e) {
                    zglosBlad(k.nazwa + ": " + (e && e.message ? String(e.message).slice(0, 80) : e));
                }
            }
            return null;
        }

        async function pobierzBlob(adres) {
            const cap = pobierzCapHttp();
            if (cap) {
                const odp = await cap.request({ url: adres, method: "GET", headers: ostatnieNaglowki, responseType: "blob" });
                if (odp.status < 200 || odp.status >= 300) throw new Error("odpowiedź " + odp.status);
                const bin = atob(odp.data);
                const bajty = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bajty[i] = bin.charCodeAt(i);
                return new Blob([bajty], { type: ostatniTypAudio });
            }
            const res = await fetch(adres);
            if (!res.ok) throw new Error("odpowiedź " + res.status);
            return await res.blob();
        }

        function zglosBlad(tekst) {
            ostatniBlad = tekst;
            bledy.push(tekst);
        }

        function pokazBledy() {
            playlistModal.replaceChildren();
            playlistModal.appendChild(el('h3', '', 'Nie udało się pobrać utworu'));
            playlistModal.appendChild(el('pre', 'lyrics-text', bledy.length ? bledy.join("\n") : "Brak szczegółów"));
            playlistModal.appendChild(przycisk('Zamknij', 'accent', zamknijModale));
            otworzModal(playlistModal);
        }

        function otworzBaze() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open('decibel', 1);
                req.onupgradeneeded = () => req.result.createObjectStore('offline', { keyPath: 'url' });
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function operacjaBazy(tryb, akcja) {
            const db = await otworzBaze();
            return new Promise((resolve, reject) => {
                const tx = db.transaction('offline', tryb);
                const req = akcja(tx.objectStore('offline'));
                tx.oncomplete = () => resolve(req ? req.result : undefined);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        async function odczytajOffline(id) {
            try {
                return (await operacjaBazy('readonly', st => st.get(id))) || null;
            } catch (e) {
                return null;
            }
        }

        async function wszystkieOffline() {
            try {
                return (await operacjaBazy('readonly', st => st.getAll())) || [];
            } catch (e) {
                return [];
            }
        }

        async function pobierzOffline(track) {
            pokazPowiadomienie("Pobieranie: " + track.title + "...");
            try {
                if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
                const zrodlo = await pobierzStrumien(track.url);
                if (!zrodlo) throw new Error("brak strumienia");
                const blob = await pobierzBlob(zrodlo);
                await operacjaBazy('readwrite', st => st.put({
                    url: track.url,
                    title: track.title,
                    artist: track.artist || "",
                    blob: blob
                }));
                pokazPowiadomienie("Pobrano do Offline!");
            } catch (e) {
                pokazPowiadomienie("Błąd pobierania");
            }
        }

        async function usunOffline(id) {
            try {
                await operacjaBazy('readwrite', st => st.delete(id));
                pokazPowiadomienie("Usunięto z Offline");
            } catch (e) {
                pokazPowiadomienie("Nie udało się usunąć");
            }
            pokazOffline();
        }

        async function pokazOffline() {
            const token = ++tokenWidoku;
            trackList.replaceChildren(komunikat("Wczytywanie..."));
            const rekordy = await wszystkieOffline();
            if (token !== tokenWidoku) return;
            const lista = rekordy.map(r => ({ title: r.title, url: r.url, artist: r.artist }));
            renderujUtwory(lista, { offline: true, naglowek: naglowek('Pobrane utwory', []) });
        }

        async function szukaj(query) {
            const wynikiPiped = await szukajPiped(query);
            if (wynikiPiped) return wynikiPiped;
            return await szukajYoutubei(query);
        }

        async function szukajPiped(query) {
            const dane = await zapytajPiped(
                "/search?q=" + encodeURIComponent(query) + "&filter=videos",
                d => d && Array.isArray(d.items)
            );
            if (!dane) return null;
            return dane.items
                .filter(item => item.url && item.url.includes("v="))
                .map(item => ({
                    title: item.title,
                    url: item.url.split("v=")[1].split("&")[0],
                    artist: item.uploaderName || ""
                }));
        }

        async function pobierzStrumien(videoId) {
            bledy = [];
            ostatnieNaglowki = {};
            const bezposredni = await pobierzStrumienYoutubei(videoId);
            if (bezposredni) return bezposredni;
            const dane = await zapytajPiped(
                "/streams/" + encodeURIComponent(videoId),
                d => d && Array.isArray(d.audioStreams) && d.audioStreams.some(s => s.url),
                10000
            );
            if (dane) {
                const strumienie = dane.audioStreams.filter(s => s.url);
                const waga = s => (s.mimeType && s.mimeType.includes("mp4") ? 1 : 0);
                strumienie.sort((a, b) => (waga(b) - waga(a)) || ((b.bitrate || 0) - (a.bitrate || 0)));
                return strumienie[0].url;
            }
            return await pobierzStrumienInvidious(videoId);
        }

        function wczytajPlaylisty() {
            try {
                const zapisane = JSON.parse(localStorage.getItem('playlisty'));
                if (zapisane && typeof zapisane === 'object' && !Array.isArray(zapisane)) return zapisane;
            } catch (e) {}
            return { "Ulubione": [] };
        }

        function zapiszPlaylisty() {
            try {
                localStorage.setItem('playlisty', JSON.stringify(playlisty));
            } catch (e) {
                pokazPowiadomienie("Nie udało się zapisać playlist");
            }
        }

        function ustawMediaSession(track) {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: (track.artist || "Decibel").replace("- Topic", "").trim(),
                album: "Decibel"
            });
        }

        function zarejestrujAkcjeMediaSession() {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.setActionHandler('play', () => {
                audio.play().catch(() => {});
            });
            navigator.mediaSession.setActionHandler('pause', () => {
                audio.pause();
            });
            navigator.mediaSession.setActionHandler('nexttrack', () => {
                grajNastepna();
            });
        }

        async function playTrack(track, index = -1) {
            const token = ++tokenOdtwarzania;
            probaPamieci = false;
            aktualnyIndeks = index;
            aktualnyUtwor = track;
            nowPlaying.textContent = "Ładowanie: " + track.title;
            progressSlider.disabled = true;

            const lokalny = await odczytajOffline(track.url);
            if (token !== tokenOdtwarzania) return;

            let zrodlo = null;
            let etykieta = track.title;
            if (lokalny && lokalny.blob) {
                if (aktualnyBlobUrl) URL.revokeObjectURL(aktualnyBlobUrl);
                aktualnyBlobUrl = URL.createObjectURL(lokalny.blob);
                zrodlo = aktualnyBlobUrl;
                etykieta = "[OFFLINE] " + track.title;
            } else {
                zrodlo = await pobierzStrumien(track.url);
                if (token !== tokenOdtwarzania) return;
            }

            if (!zrodlo) {
                nowPlaying.textContent = track.title;
                pokazBledy();
                return;
            }

            audio.src = zrodlo;
            nowPlaying.textContent = etykieta;
            progressSlider.disabled = false;
            ustawMediaSession(track);

            try {
                await audio.play();
            } catch (e) {
                pokazPowiadomienie("Nie można odtworzyć utworu");
            }
        }

        function przelaczLosowe() {
            trybLosowy = !trybLosowy;
            const btn = document.getElementById('shuffle-btn');
            if (btn) btn.textContent = "Losowo: " + (trybLosowy ? "WŁ" : "WYŁ");
            pokazPowiadomienie(trybLosowy ? "Włączono losowanie" : "Kolejność po kolei");
        }

        function odtworzOdPoczatku() {
            if (aktualnaKolejka.length === 0) return;
            const start = trybLosowy ? Math.floor(Math.random() * aktualnaKolejka.length) : 0;
            playTrack(aktualnaKolejka[start], start);
        }

        function losowyIndeksBezPowtorek() {
            let nowy = aktualnyIndeks;
            while (nowy === aktualnyIndeks) {
                nowy = Math.floor(Math.random() * aktualnaKolejka.length);
            }
            return nowy;
        }

        function grajNastepna() {
            if (aktualnaKolejka.length === 0) return;
            if (trybLosowy) {
                aktualnyIndeks = aktualnaKolejka.length === 1 ? 0 : losowyIndeksBezPowtorek();
            } else {
                aktualnyIndeks = (aktualnyIndeks + 1) % aktualnaKolejka.length;
            }
            playTrack(aktualnaKolejka[aktualnyIndeks], aktualnyIndeks);
        }

        function zamknijMenu() {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        }

        function otworzModal(modal) {
            zamknijModale();
            backdrop.style.display = 'block';
            modal.style.display = 'flex';
        }

        function zamknijModale() {
            playlistModal.style.display = 'none';
            lyricsModal.style.display = 'none';
            backdrop.style.display = 'none';
        }

        function renderujUtwory(lista, opcje = {}) {
            aktualnaKolejka = lista || [];
            trackList.replaceChildren();
            if (opcje.naglowek) trackList.appendChild(opcje.naglowek);

            if (aktualnaKolejka.length === 0) {
                trackList.appendChild(komunikat("Brak utworów na tej liście"));
                return;
            }

            aktualnaKolejka.forEach((track, index) => {
                const item = el('div', 'track-item');

                const tytul = el('span', 'track-title', track.title);
                tytul.addEventListener('click', () => playTrack(track, index));

                const kontener = el('div', 'menu-container');
                const kropki = el('button', 'dots-btn', '\u22EE');
                const menu = el('div', 'dropdown-menu');

                kropki.addEventListener('click', e => {
                    e.stopPropagation();
                    const otwarte = menu.classList.contains('show');
                    zamknijMenu();
                    if (!otwarte) menu.classList.add('show');
                });

                const dodaj = el('button', '', 'Dodaj do playlisty');
                dodaj.addEventListener('click', () => dodajDoPlaylisty(track));
                menu.appendChild(dodaj);

                if (opcje.offline) {
                    const usunLokalny = el('button', 'danger-text', 'Usuń z offline');
                    usunLokalny.addEventListener('click', () => usunOffline(track.url));
                    menu.appendChild(usunLokalny);
                } else {
                    const pobierz = el('button', '', 'Pobierz do offline');
                    pobierz.addEventListener('click', () => pobierzOffline(track));
                    menu.appendChild(pobierz);
                }

                if (opcje.playlista) {
                    const usun = el('button', 'danger-text', 'Usuń z playlisty');
                    usun.addEventListener('click', () => usunZPlaylisty(opcje.playlista, index));
                    menu.appendChild(usun);
                }

                kontener.appendChild(kropki);
                kontener.appendChild(menu);
                item.appendChild(tytul);
                item.appendChild(kontener);
                trackList.appendChild(item);
            });
        }

        function zapytajONazwe(callback) {
            playlistModal.replaceChildren();
            const input = el('input', 'search-input');
            input.type = 'text';
            input.placeholder = 'Nazwa playlisty';
            input.maxLength = 40;

            const zapisz = przycisk('Zapisz', 'accent', () => {
                const nazwa = input.value.trim();
                if (!nazwa) return;
                zamknijModale();
                callback(nazwa);
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') zapisz.click();
            });

            playlistModal.appendChild(el('h3', '', 'Nazwa nowej playlisty:'));
            playlistModal.appendChild(input);
            playlistModal.appendChild(zapisz);
            playlistModal.appendChild(przycisk('Anuluj', '', zamknijModale));
            otworzModal(playlistModal);
            input.focus();
        }

        function dodajDoPlaylisty(track) {
            playlistModal.replaceChildren();
            playlistModal.appendChild(el('h3', '', 'Wybierz playlistę:'));

            Object.keys(playlisty).forEach(nazwa => {
                playlistModal.appendChild(przycisk(nazwa, '', () => zapiszDoWybranej(nazwa, track)));
            });

            playlistModal.appendChild(przycisk('+ Nowa playlista', 'accent', () => {
                zapytajONazwe(nazwa => {
                    if (!Object.prototype.hasOwnProperty.call(playlisty, nazwa)) playlisty[nazwa] = [];
                    zapiszDoWybranej(nazwa, track);
                });
            }));
            playlistModal.appendChild(przycisk('Anuluj', '', zamknijModale));
            otworzModal(playlistModal);
        }

        function zapiszDoWybranej(nazwa, track) {
            playlisty[nazwa].push({ title: track.title, url: track.url, artist: track.artist || "" });
            zapiszPlaylisty();
            zamknijModale();
            pokazPowiadomienie("Dodano do: " + nazwa);
        }

        function usunZPlaylisty(nazwa, index) {
            playlisty[nazwa].splice(index, 1);
            zapiszPlaylisty();
            otworzPlayliste(nazwa);
            pokazPowiadomienie("Usunięto z playlisty");
        }

        function usunPlayliste(nazwa) {
            delete playlisty[nazwa];
            zapiszPlaylisty();
            pokazBiblioteke();
            pokazPowiadomienie("Usunięto playlistę: " + nazwa);
        }

        function utworzPlayliste() {
            zapytajONazwe(nazwa => {
                if (Object.prototype.hasOwnProperty.call(playlisty, nazwa)) {
                    pokazPowiadomienie("Taka playlista już istnieje");
                    return;
                }
                playlisty[nazwa] = [];
                zapiszPlaylisty();
                pokazBiblioteke();
            });
        }

        function pokazBiblioteke() {
            tokenWidoku++;
            trackList.replaceChildren(
                naglowek('Twoje playlisty', [przycisk('+ Nowa playlista', 'accent', utworzPlayliste)])
            );

            Object.keys(playlisty).forEach(nazwa => {
                const item = el('div', 'track-item clickable');
                item.appendChild(el('span', 'track-title', nazwa + " (" + playlisty[nazwa].length + " utworów)"));
                item.appendChild(przycisk('Usuń', 'accent', e => {
                    e.stopPropagation();
                    usunPlayliste(nazwa);
                }));
                item.addEventListener('click', () => otworzPlayliste(nazwa));
                trackList.appendChild(item);
            });
        }

        function otworzPlayliste(nazwa) {
            tokenWidoku++;
            const losowo = przycisk("Losowo: " + (trybLosowy ? "WŁ" : "WYŁ"), '', przelaczLosowe);
            losowo.id = 'shuffle-btn';
            const pasek = naglowek('Playlista: ' + nazwa, [
                przycisk('Wróć', '', pokazBiblioteke),
                przycisk('Odtwórz', 'accent', odtworzOdPoczatku),
                losowo
            ]);
            renderujUtwory(playlisty[nazwa], { naglowek: pasek, playlista: nazwa });
        }

        function wybierzGatunek(gatunek) {
            localStorage.setItem('ulubionyGatunek', gatunek);
            zaladujStroneGlowna();
        }

        function pokazWyborGatunku() {
            tokenWidoku++;
            trackList.replaceChildren(el('h2', 'section-title', 'Wybierz gatunek na start:'));
            GATUNKI.forEach(g => {
                const item = el('div', 'track-item clickable');
                item.appendChild(el('span', 'track-title', g));
                item.appendChild(przycisk('Wybierz', '', () => wybierzGatunek(g)));
                item.addEventListener('click', () => wybierzGatunek(g));
                trackList.appendChild(item);
            });
        }

        async function zaladujStroneGlowna() {
            const zapisany = localStorage.getItem('ulubionyGatunek');
            if (!zapisany) {
                pokazWyborGatunku();
                return;
            }

            const token = ++tokenWidoku;
            trackList.replaceChildren(komunikat("Ładowanie polecanych (" + zapisany + ")..."));

            const wyniki = await szukaj(zapisany + " songs");
            if (token !== tokenWidoku) return;

            if (!wyniki) pokazPowiadomienie("Brak połączenia z serwerami");

            const pasek = naglowek('Polecane dla Ciebie (' + zapisany + ')', [
                przycisk('Zmień gatunek', '', pokazWyborGatunku)
            ]);
            renderujUtwory(wyniki || [], { naglowek: pasek });
        }

        function ustawAktywny(przycisk) {
            navButtons.forEach(b => b.classList.remove('active'));
            przycisk.classList.add('active');
        }

        async function pokazTekstPiosenki() {
            if (!aktualnyUtwor) {
                pokazPowiadomienie("Najpierw włącz piosenkę!");
                return;
            }

            lyricsModal.replaceChildren(el('h3', '', 'Szukam tekstu...'));
            otworzModal(lyricsModal);

            const czystyTytul = aktualnyUtwor.title.replace(/\(.*?\)|\[.*?\]/g, "").trim();
            const artysta = (aktualnyUtwor.artist || "").replace("- Topic", "").trim();
            const zapytanie = (artysta && !czystyTytul.includes(" - ") && !czystyTytul.toLowerCase().includes(artysta.toLowerCase()))
                ? artysta + " " + czystyTytul
                : czystyTytul;

            const zamknij = przycisk('Zamknij', 'accent', zamknijModale);

            try {
                const res = await fetch("https://lrclib.net/api/search?q=" + encodeURIComponent(zapytanie));
                const dane = await res.json();
                const trafienie = Array.isArray(dane) ? dane.find(d => d.plainLyrics) : null;

                lyricsModal.replaceChildren();
                if (trafienie) {
                    const gora = el('div', 'section-header');
                    gora.appendChild(el('h3', '', trafienie.trackName + " - " + trafienie.artistName));
                    gora.appendChild(zamknij);
                    lyricsModal.appendChild(gora);
                    lyricsModal.appendChild(el('pre', 'lyrics-text', trafienie.plainLyrics));
                } else {
                    lyricsModal.appendChild(el('p', '', 'Nie znaleziono tekstu dla: ' + zapytanie));
                    lyricsModal.appendChild(zamknij);
                }
            } catch (e) {
                lyricsModal.replaceChildren(el('p', '', 'Błąd połączenia z bazą tekstów.'), zamknij);
            }
        }

        searchInput.addEventListener('keydown', async function (e) {
            if (e.key !== 'Enter') return;
            const query = searchInput.value.trim();
            if (!query) return;
            searchInput.blur();
            localStorage.setItem('ulubionyGatunek', query);
            ustawAktywny(document.getElementById('btn-search'));

            const token = ++tokenWidoku;
            trackList.replaceChildren(komunikat("Szukam..."));

            const wyniki = await szukaj(query);
            if (token !== tokenWidoku) return;

            if (!wyniki) pokazPowiadomienie("Brak połączenia z serwerami");
            renderujUtwory(wyniki || []);
        });

        playBtn.addEventListener('click', function () {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play().catch(() => {});
            } else {
                audio.pause();
            }
        });

        nextBtn.addEventListener('click', grajNastepna);
        lyricsBtn.addEventListener('click', pokazTekstPiosenki);
        backdrop.addEventListener('click', zamknijModale);
        window.addEventListener('click', zamknijMenu);

        audio.addEventListener('play', function () {
            playBtn.textContent = "Pauza";
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
        });

        audio.addEventListener('pause', function () {
            playBtn.textContent = "Odtwórz";
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        });

        audio.addEventListener('error', async function () {
            if (!audio.src) return;
            if (audio.src.startsWith('blob:') || probaPamieci) {
                pokazPowiadomienie("Błąd odtwarzania");
                return;
            }
            probaPamieci = true;
            const token = tokenOdtwarzania;
            pokazPowiadomienie("Ponawiam przez pamięć...");
            try {
                const blob = await pobierzBlob(audio.src);
                if (token !== tokenOdtwarzania) return;
                if (aktualnyBlobUrl) URL.revokeObjectURL(aktualnyBlobUrl);
                aktualnyBlobUrl = URL.createObjectURL(blob);
                audio.src = aktualnyBlobUrl;
                await audio.play();
            } catch (e) {
                pokazPowiadomienie("Błąd odtwarzania");
            }
        });

        audio.addEventListener('timeupdate', function () {
            if (audio.duration) {
                progressSlider.value = (audio.currentTime / audio.duration) * 100;
                timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', grajNastepna);

        progressSlider.addEventListener('input', function () {
            if (audio.duration) {
                audio.currentTime = (progressSlider.value / 100) * audio.duration;
            }
        });

        volumeSlider.addEventListener('input', function () {
            audio.volume = volumeSlider.value / 100;
        });

        document.getElementById('btn-home').addEventListener('click', function () {
            ustawAktywny(this);
            pokazWyborGatunku();
        });

        document.getElementById('btn-search').addEventListener('click', function () {
            ustawAktywny(this);
            searchInput.focus();
        });

        document.getElementById('btn-offline').addEventListener('click', function () {
            ustawAktywny(this);
            pokazOffline();
        });

        document.getElementById('btn-library').addEventListener('click', function () {
            ustawAktywny(this);
            pokazBiblioteke();
        });

        document.addEventListener('DOMContentLoaded', function () {
            playlisty = wczytajPlaylisty();
            audio.volume = volumeSlider.value / 100;
            zarejestrujAkcjeMediaSession();
            odswiezInstancje();
            zaladujStroneGlowna();
        });
    </script>
</body>
</html>
