name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: |
          ls node_modules/youtubei.js/bundle
          cp node_modules/youtubei.js/bundle/browser.js www/youtubei.bundle.js || cp node_modules/youtubei.js/bundle/browser.min.js www/youtubei.bundle.js
          ls -la www
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Decibel-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
